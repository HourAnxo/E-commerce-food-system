spring.application.name=E-commerce-food-system

# Local-only secrets, gitignored. "optional:" means the app still boots when the
# file is absent (CI, Docker, the VPS) — those supply values via env vars instead.
# Imported files override the ones below; real env vars still win over both.
spring.config.import=optional:classpath:application-local.properties

# Database (override via env vars in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e_commerce_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server Port (FIX ADDED)
server.port=8081
# Surface ResponseStatusException reasons in the JSON error body (e.g. Bakong config errors)
server.error.include-message=always

# Bakong KHQR (override via env vars in production — NEVER commit a real token)
# Get account-id + api-token from https://api-bakong.nbc.gov.kh

bakong.merchant-name=${BAKONG_MERCHANT_NAME:Food System}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:Phnom Penh}
bakong.currency=${BAKONG_CURRENCY:USD}


# Telegram bot — token comes from @BotFather. NEVER commit a real token here.
# Leave it empty to disable the bot: FoodOrderBot is @ConditionalOnExpression on
# this property, so with no token the rest of the app still boots normally.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
